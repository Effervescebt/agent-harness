# Feature 1 experiment: context strategy x prompt caching on deepseek_flash.
[routing]
strategy = "single"
primary = "deepseek_flash"

[cache]
enabled = true

[agent]
max_steps = 40
max_tokens_per_step = 1024
parallel_tools = false
compression = "truncate"
keep_last = 2
old_chars = 200
checkpoint_chars = 2000
