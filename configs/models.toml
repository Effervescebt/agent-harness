# Models the run configs refer to by name. Prices: USD per 1M tokens, used for cost accounting only.
# Anthropic prices from the Anthropic model table (2026-10-06); cache writes are 1.25x input (5-minute TTL),
# cache reads 0.1x. DeepSeek prices from api-docs.deepseek.com/quick_start/pricing, off-peak rates
# (all runs on 2026-10-25, a Sunday, which is off-peak all day).
# Thinking is turned off on the Claude models so only context strategy varies between configs.

[models.mock]
provider = "mock"
model = "mock"
input = 0.0
output = 0.0

[models.haiku]
provider = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"
thinking = { type = "disabled" }
input = 0.10
cached_input = 0.01
cache_write = 0.125
output = 0.50

[models.sonnet]
provider = "anthropic"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"
thinking = { type = "between_tools" }
input = 2.00
cached_input = 0.20
cache_write = 2.50
output = 10.00

[models.deepseek_flash]
provider = "openai"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
input = 0.15
cached_input = 0.003
output = 0.60

# Self-hosted: Qwen3-8B (BF16) served by vLLM on one rented NVIDIA L40 48GB (RunPod community cloud,
# $0.69/h). Cost is GPU-hours, not tokens (gpu table in the run config). Address and key come from the
# environment (VLLM_BASE_URL, VLLM_API_KEY). Thinking is turned off to match the Claude runs.
[models.qwen3_8b_vllm]
provider = "openai"
model = "qwen3-8b"
base_url_env = "VLLM_BASE_URL"
api_key_env = "VLLM_API_KEY"
send_temperature = false
salt_when_uncached = true
extra_body = { chat_template_kwargs = { enable_thinking = false } }
